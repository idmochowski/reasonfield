name: Deploy to Development

# Development deployment workflow - deploys from dev branch to development URLs
on:
  push:
    branches: [ dev ]
  workflow_dispatch: # Allow manual triggering

env:
  BACKEND_SERVICE_NAME: reasonfield-backend-dev
  BACKEND_REGION: us-central1
  FRONTEND_PROJECT_NAME: reasonfield-frontend-dev
  ENVIRONMENT: development

jobs:
  deploy-backend-dev:
    name: Deploy Backend (Dev)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Authenticate with Google Cloud
      run: |
        echo ${{ secrets.GOOGLE_CLOUD_SA_KEY }} | base64 -d > service-account.json
        gcloud auth activate-service-account --key-file=service-account.json
        gcloud config set project ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
        
    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
        
    - name: Configure Docker for gcloud
      run: gcloud auth configure-docker
      
    - name: Deploy Backend to Cloud Run (Dev)
      run: |
        cd backend
        chmod +x ../scripts/deploy-backend-dev.sh
        ../scripts/deploy-backend-dev.sh
      env:
        GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
        GOOGLE_CLOUD_SA_KEY: ${{ secrets.GOOGLE_CLOUD_SA_KEY }}
        BACKEND_SERVICE_NAME: ${{ env.BACKEND_SERVICE_NAME }}
        BACKEND_REGION: ${{ env.BACKEND_REGION }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GEMINI_API: ${{ secrets.GEMINI_API }}
        ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        
    - name: Verify Backend Deployment (Dev)
      run: |
        echo "Backend deployed successfully!"
        echo "Backend URL: https://dev-api.reasonfield.com"
        
  deploy-frontend-dev:
    name: Deploy Frontend (Dev)
    runs-on: ubuntu-latest
    needs: deploy-backend-dev # Wait for backend to deploy first
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Install Wrangler
      run: npm install -g wrangler
        
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_BASE_URL: https://dev-api.reasonfield.com
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        VITE_APP_VERSION: ${{ github.sha }}
        
    - name: Deploy Frontend to Cloudflare Pages (Dev)
      run: |
        cd frontend
        chmod +x ../scripts/deploy-frontend-dev.sh
        ../scripts/deploy-frontend-dev.sh
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        FRONTEND_PROJECT_NAME: ${{ env.FRONTEND_PROJECT_NAME }}
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        VITE_APP_VERSION: ${{ github.sha }}
        
    - name: Verify Frontend Deployment (Dev)
      run: |
        echo "Frontend deployed successfully!"
        echo "Frontend URL: https://dev.reasonfield.com"
        
  verify-deployment-dev:
    name: Verify Deployment (Dev)
    runs-on: ubuntu-latest
    needs: [deploy-backend-dev, deploy-frontend-dev]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test Backend Health (Dev)
      run: |
        echo "Testing backend health..."
        curl -f https://dev-api.reasonfield.com/health || echo "Backend health check failed"
        
    - name: Test Frontend Accessibility (Dev)
      run: |
        echo "Testing frontend accessibility..."
        curl -f https://dev.reasonfield.com || echo "Frontend accessibility check failed"
        
    - name: Deployment Summary (Dev)
      run: |
        echo "🎉 Development deployment completed successfully!"
        echo "📱 Frontend: https://dev.reasonfield.com"
        echo "🔧 Backend: https://dev-api.reasonfield.com"
        echo "🚀 Development environment is ready for testing!" 